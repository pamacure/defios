name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: vet and unit tests
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go vet -tags e2e ./e2e
      - run: go test ./...

  e2e:
    name: e2e (headscale in Docker)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -tags e2e ./e2e -timeout 20m -v
