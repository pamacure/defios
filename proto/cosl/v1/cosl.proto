syntax = "proto3";

package defios.cosl.v1;

option go_package = "defios.com/proto/cosl/v1;coslv1";

// Envelope is the signed unit the COSL stores (docs/spec/mvp.md §5.1).
// No maps anywhere in this file: every message is signed over its
// deterministic serialization.
message Envelope {
  uint32 version = 1;                 // 1
  bytes group_id = 2;                 // 32
  uint32 msg_type = 3;                // registry
  bytes sender = 4;                   // Node ID, 32
  bytes msg_id = 5;                   // 32 random, signature-covered
  optional bytes conversation_id = 6; // unset = Group-level; else 32 derived
  int64 created_at = 7;               // unix nanos, advisory, never ordering
  bytes payload = 8;                  // type-specific protobuf
  bytes sig = 9;                      // 64-byte Ed25519
}

// Payloads (docs/spec/mvp.md §5.3).

message MembershipJoin {
  string display_name = 1;            // UTF-8, 1–64 chars, no newlines
  string tsnet_hostname = 2;
  bytes encryption_public_key = 3;    // 32-byte X25519
  bytes auth_public_key = 4;          // 32-byte Ed25519
}

message SealedBox {
  bytes to = 1;                       // recipient Node ID
  bytes ephemeral_public_key = 2;     // 32
  bytes nonce = 3;                    // 24
  bytes ciphertext = 4;
}

message SessionStart {
  bytes session_id = 1;               // 32
  string curve = 2;                   // ecdsa | eddsa
  uint32 t = 3;                       // DeFiOS min-signers
  uint32 n = 4;                       // |Roster|
  repeated bytes participants = 5;    // Node IDs, sorted; must equal the Roster
  repeated SealedBox nonce_boxes = 6; // one per participant
  // A signing Session (docs/adr/0010-signing-session-semantics.md) names the
  // sign.request it signs. Its participants are the t signers, a subset of the
  // Roster, and t is the Key's t. Unset for keygen.
  bytes sign_request_id = 7;          // msg_id of the sign.request; 32
}

message SessionAbort {
  bytes session_id = 1;
  string reason = 2;
}

message SessionComplete {
  bytes session_id = 1;
  string curve = 2;
  bytes public_key = 3;               // canonical export
  // A signing Session carries one 65-byte r||s||v signature per Digest, in
  // the order the Digests flatten across the request's transactions.
  repeated bytes signatures = 4;
}

message TssSession {
  bytes session_id = 1;
  bytes routing_tag = 2;              // empty = broadcast; else recipient Node ID
  bytes ephemeral_public_key = 3;     // empty iff broadcast
  bytes nonce = 4;                    // empty iff broadcast
  bytes data = 5;                     // broadcast: engine bytes; p2p: box ciphertext
}

message AppFreeform {
  string text = 1;                    // UTF-8, max 65536 bytes
  string content_type = 2;            // default text/plain
}

// NetworkConfig is the payload of network.create and network.update
// (docs/adr/0008-networks-on-cosl.md). An update carries the whole config and
// supersedes the alias's current one. Only the fields of `type` may be set.
message NetworkConfig {
  string alias = 1;                   // ^[a-z0-9][a-z0-9_-]{0,63}$
  string type = 2;                    // bitcoin | ethereum | solana
  repeated string rpc_urls = 3;       // failover order; a Node may override
  uint64 chain_id = 4;                // ethereum, > 0
  string network = 5;                 // bitcoin: mainnet | testnet | signet | regtest
  string cluster = 6;                 // solana: mainnet-beta | devnet | testnet | localnet
  string genesis_hash = 7;            // solana, optional, base58
}

message NetworkRemove {
  string alias = 1;
}

// SignRequest is the payload of sign.request (docs/adr/0009-sign-request-on-cosl.md).
// The envelope's conversation_id is the target Key's Conversation ID. Every
// consensus-critical field is carried here, so each Node derives the same
// Digests without any chain RPC.
message SignRequest {
  repeated SignTransaction transactions = 1;  // ordered, at least one
  string reason = 2;                          // UTF-8, required
  uint64 deadline_seconds = 3;                // after the envelope's created_at; > 0
  MessageRef reason_ref = 4;                  // optional pointer to the talk behind the reason
}

// SignAccept is the payload of sign.accept (docs/adr/0010-signing-session-semantics.md).
// The envelope's conversation_id is the target Key's, as for sign.request, and
// its sender is the accepting Node. The proposer's signature on the
// sign.request counts as its accept, so it never appends one.
message SignAccept {
  bytes sign_request_id = 1;          // msg_id of the sign.request; 32
}

message MessageRef {
  bytes conversation_id = 1;          // unset = Group-level, else 32
  bytes msg_id = 2;                   // 32
}

message SignTransaction {
  bytes network_config_id = 1;        // msg_id of the network.create/update row that defines the Network
  oneof intent {
    EthereumIntent ethereum = 2;
    BitcoinIntent bitcoin = 3;
    SolanaIntent solana = 4;
  }
}

// EthereumIntent is an EIP-1559 transaction; the chain id is the Network's.
// Amounts are base-10 integer strings (wei).
message EthereumIntent {
  bytes to = 1;                       // 20 bytes
  string value = 2;
  bytes data = 3;
  uint64 nonce = 4;
  uint64 gas_limit = 5;               // > 0
  string max_fee_per_gas = 6;         // > 0
  string max_priority_fee_per_gas = 7;
}

// BitcoinIntent is a transaction signed per input; the fee is the inputs
// minus the outputs.
message BitcoinIntent {
  repeated BitcoinInput inputs = 1;
  repeated BitcoinOutput outputs = 2;
  uint32 lock_time = 3;
}

message BitcoinInput {
  string txid = 1;                    // 64 hex
  uint32 vout = 2;
  uint64 amount_sats = 3;
  bytes script_pubkey = 4;            // the spent output's script
}

message BitcoinOutput {
  string address = 1;
  uint64 amount_sats = 2;
}

message SolanaIntent {
  string fee_payer = 1;               // base58
  string recent_blockhash = 2;        // base58
  repeated SolanaInstruction instructions = 3;
}

message SolanaInstruction {
  string program_id = 1;              // base58
  repeated SolanaAccount accounts = 2;
  bytes data = 3;
}

message SolanaAccount {
  string pubkey = 1;                  // base58
  bool signer = 2;
  bool writable = 3;
}
